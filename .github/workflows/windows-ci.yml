name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Check release version consistency
        run: npm run release:check-version

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

      - name: Check Rust targets
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: Build Tauri NSIS installer
        run: npm run tauri build -- -- --locked

      - name: Verify NSIS artifact
        run: npm run release:verify-artifact

      - name: Generate and verify SHA256 checksum
        run: npm run release:verify-sha256

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: quotastrip-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/artifact-manifest.txt
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
