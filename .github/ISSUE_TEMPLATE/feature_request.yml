name: Feature request
description: Propose a focused improvement aligned with the project roadmap
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        QuotaStrip is Windows-first and intentionally narrow for v0.1.0. Describe the user problem before proposing a solution, and do not include private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain the smallest useful behavior and how it preserves Codex-window attachment.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows or simpler approaches.
  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - Windows 10
        - Windows 11
        - Both Windows 10 and Windows 11
        - Outside the current Windows-first scope
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex Desktop version
      description: If the request depends on a specific Codex behavior, provide the version; otherwise enter "not version-specific".
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: QuotaStrip version
      description: Use "unreleased" if no packaged application exists.
    validations:
      required: true
  - type: textarea
    id: privacy-impact
    attributes:
      label: Security and privacy impact
      description: Would this require new data access, storage, permissions, network calls, or logging?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include a token, cookie, credential, auth file, private prompt, account data, or private project code.
          required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I reviewed the roadmap and understand that a request may be deferred to a later phase.
          required: true
