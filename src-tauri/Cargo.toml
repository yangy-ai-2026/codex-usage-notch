[package]
name = "quotastrip"
default-run = "quotastrip"
version = "0.1.0"
description = "QuotaStrip native application"
authors = ["QuotaStrip contributors"]
edition = "2021"
autobins = false

[lib]
name = "quotastrip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quotastrip"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5", features = [] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
