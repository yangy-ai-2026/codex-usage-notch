[package]
name = "codex-usage-notch"
default-run = "codex-usage-notch"
version = "0.1.0"
description = "Codex Usage Notch native application"
authors = ["Codex Usage Notch contributors"]
edition = "2021"

[lib]
name = "codex_usage_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-usage-notch"
path = "src/main.rs"

[[bin]]
name = "usage_probe"
path = "src/bin/usage_probe.rs"

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5", features = [] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
